mpas-ocean:
  time_management:
    config_run_duration: 0010_00:00:00
  tracer_forcing_activeTracers:
    config_use_activeTracers_surface_bulk_forcing: false
    config_use_activeTracers_surface_restoring: false
    config_use_activeTracers_interior_restoring: false
  bottom_drag:
    config_implicit_constant_bottom_drag_coeff: 0.0
  cvmix:
    config_use_cvmix: false
Omega:
  Advection:
    FluxThicknessType: Center
  Dimension:
    NVertLevels: 1
  IOStreams:
    InitialState:
      UsePointerFile: false
      Filename: init.nc
      Mode: read
      Precision: double
      Freq: 1
      FreqUnits: OnStartup
      UseStartEnd: false
      Contents:
        - State
        - WindStressZonal
        - WindStressMeridional
    History:
      UsePointerFile: false
      Filename: output.nc
      Freq: {{ output_frequency }}
      FreqUnits: {{ output_frequency_units }}
      IfExists: replace
      # effectively never
      FileFreq: 9999
      FileFreqUnits: years
      UseStartEnd: false
      Contents:
        - State
        - SshCell
