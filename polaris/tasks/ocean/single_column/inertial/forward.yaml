ocean:
  time_management:
    config_run_duration: 0010_00:00:00
mpas-ocean:
  tracer_forcing_activeTracers:
    config_use_activeTracers_surface_bulk_forcing: false
    config_use_activeTracers_surface_restoring: false
    config_use_activeTracers_interior_restoring: false
  bottom_drag:
    config_implicit_constant_bottom_drag_coeff: 0.0
  cvmix:
    config_use_cvmix: false
Omega:
  Advection:
    FluxThicknessType: Center
  Dimension:
    NVertLevels: 1
  Tendencies:
    ThicknessFluxTendencyEnable: true
    PVTendencyEnable: true
    KETendencyEnable: true
    SSHTendencyEnable: true
    VelDiffTendencyEnable: false
    VelHyperDiffTendencyEnable: false
    TracerHorzAdvTendencyEnable: false
    TracerDiffTendencyEnable: false
    TracerHyperDiffTendencyEnable: true
    UseCustomTendency: false
    ManufacturedSolutionTendency: false
    WindForcingTendencyEnable: true
  IOStreams:
    InitialState:
      UsePointerFile: false
      Filename: init.nc
      Mode: read
      Precision: double
      Freq: 1
      FreqUnits: OnStartup
      UseStartEnd: false
      Contents:
      - NormalVelocity
      - LayerThickness
      - WindStressZonal
      - WindStressMeridional
      FileFreq: 9999
      FileFreqUnits: years
    History:
      UsePointerFile: false
      Filename: output.nc
      Mode: write
      IfExists: append
      Precision: double
      Freq: 1
      FreqUnits: Seconds
      UseStartEnd: false
      Contents:
      - NormalVelocity
      - LayerThickness
      - SshCellDefault
      FileFreq: 9999
      FileFreqUnits: years
